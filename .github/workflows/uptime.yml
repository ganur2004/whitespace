name: Uptime

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  smoke:
    if: vars.DEMO_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke -- "${{ vars.DEMO_URL }}"
